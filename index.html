// ---- DOE truck fuel ----
// Truck fuel $/mi = (EIA weekly U.S. No 2 diesel retail - base) / mpg, rounded
// to the cent (rates.json "fsc", refreshed by fuel_doe.py on each publish),
// times Google miles. Same for flat (FC) and per-mile (MI) truck lanes.
// Rail, B-Train and Lowe's/HD customer rates are all-in: no fuel added.
function _isCAD(currency){ return String(currency||"").toUpperCase() === "CAD"; }
// USD/CAD from rates.json fsc (Bank of Canada daily average, refreshed with DOE).
function fscUsdCad(){
const fx = FSC ? Number(FSC.usdcad) : NaN;
return (fx > 0 && isFinite(fx)) ? fx : null;
}
// Fuel $/mi in the lane's currency. USD lanes: (DOE - base) / mpg, rounded to
// the cent. C$ lanes: that USD $/mi x USD/CAD, rounded to the cent. null when
// the DOE price (or, for C$ lanes, the exchange rate) isn't loaded.
function fscPerMile(currency){
const f = FSC;
if(!f) return null;
const doe = Number(f.doe), base = Number(f.base), mpg = Number(f.mpg);
if(!(doe > 0) || !isFinite(base) || !(mpg > 0)) return null;
const usd = Math.max(0, Math.round(((doe - base) / mpg) * 100) / 100);
if(!_isCAD(currency)) return usd;
const fx = fscUsdCad();
return fx != null ? Math.round(usd * fx * 100) / 100 : null;
}
function fscWeekLabel(){
const w = String((FSC && FSC.week) || "");
const m = w.match(/^\d{4}-(\d{2})-(\d{2})$/);
return m ? (+m[1]) + "/" + (+m[2]) : w;
}
function fscSourceLabel(currency){
if(!FSC) return "";
if(_isCAD(currency)){
  const fx = fscUsdCad();
  return "DOE $" + Number(FSC.doe).toFixed(3) + " wk " + fscWeekLabel() + (fx != null ? " × USD/CAD " + fx.toFixed(4) + "x" : "");
}
return "DOE $" + Number(FSC.doe).toFixed(3) + ", wk " + fscWeekLabel();
}
// Why fuel can't be priced (DOE or, on C$ lanes, the exchange rate missing).
function fscMissingNote(currency){
if(fscPerMile() == null) return "DOE fuel price not loaded — total excludes fuel";
if(_isCAD(currency) && fscUsdCad() == null) return "USD/CAD rate not loaded — can't convert fuel to C$; total excludes fuel";
return "";
}
// Fuel for a truck move of `miles`, in the lane's currency (0 when miles, the
// DOE price or the needed exchange rate are missing).
function truckFuelFor(miles, currency){
const f = fscPerMile(currency);
return (f != null && miles != null && miles > 0) ? f * miles : 0;
}

function _gpTotalForCompare(match, miles){
const rate = Number(match.rate) || 0;
const m = (miles != null) ? miles : 0;
const minCharge = Number(match.minCharge) || 0;
return Math.max(rate * m, minCharge) + truckFuelFor(m, match.currency);
}

// Competitor (ECA) estimate: your same freight logic, run from each linked
// competitor's own location to the destination.
//   TRUCK: standard per-mile lanes — apply GP's per-mile rate + DOE fuel $/mi
//          over the competitor's drive distance (B-Train flat lanes are skipped).
//   RAIL:  all-in flat lanes — derive GP's implied $/mi (flat total ÷ GP miles)
//          and apply it over the competitor's distance (fuel already included,
//          so no separate fuel line). Needs GP Google miles to set the yardstick.
async function renderEcaComparison(match, originFac, destZip, destCity, destState, miles){
const card = document.getElementById("ecaCard");
const content = document.getElementById("ecaContent");
const vsGp = document.getElementById("ecaVsGp");
if(!card || !content) return;

const isMI = match && (match.uom||"").toString().toUpperCase() === "MI";
const isRail = !!match && match.mode === "RAIL";
const railFlat = isRail ? (Number(match.flat) || 0) : 0;
const railRPM = (isRail && miles != null && miles > 0 && railFlat > 0) ? (railFlat / miles) : null;
const key = (originFac||"").split(",").slice(0,2).join(",");
const comps = ECA[key] || null;
if(!comps || !comps.length){ card.style.display = "none"; return; }

const destCityU = (destCity||"").toString().trim().toUpperCase();
const destStateU = (destState||"").toString().trim().toUpperCase();
const canEstimate = !!match && (
  (SELECTED_MODE === "TRUCK" && !isBTrainEquip(match.equip) && isMI) ||
  (SELECTED_MODE === "RAIL" && railRPM != null)
);

// Prefer actual RUW competitor lane rates for this destination (rail).
const actualByName = {};
if(SELECTED_MODE === "RAIL" && destCityU && destStateU){
  for(const c of comps){
    const ck = (c.city||"").toUpperCase()+","+(c.state||"").toUpperCase()+"|"+destCityU+","+destStateU;
    const lanes = ECA_RATE_INDEX[ck];
    if(!lanes || !lanes.length) continue;
    const named = lanes.filter(l => l.name && c.name && l.name.toUpperCase() === String(c.name).toUpperCase());
    if(!named.length) continue;
    actualByName[c.name] = named.reduce((a,b)=> a.flat <= b.flat ? a : b);
  }
}
const hasActual = Object.keys(actualByName).length > 0;
if(!hasActual && !canEstimate){ card.style.display = "none"; return; }

const myQuery = window._lastQuery;
const rate = Number(match && match.rate) || 0;
const minCharge = Number(match && match.minCharge) || 0;
const cur = (match && match.currency) || "USD";
const gpTotal = isRail ? railFlat : (match ? _gpTotalForCompare(match, miles) : 0);

MSF.ecaKind = isRail ? (railEquipGroup(match.equip) === "BOXCAR" ? "box" : "cb") : "truck";
vsGp.dataset.total = gpTotal > 0 ? String(gpTotal) : ""; vsGp.dataset.cur = cur;
vsGp.textContent = gpTotal > 0 ? ("vs GP " + fmt(gpTotal, cur)) : "";
const nActual = Object.keys(actualByName).length;
content.innerHTML = '<div class="eca-loading">'+(hasActual ? "Loading" : "Estimating")+" "+comps.length+" competitor"+(comps.length>1?"s":"")+(nActual ? " ("+nActual+" quoted)" : "")+"…</div>";
card.style.display = "block";

const destStr = buildDestString(destZip, destCity, destState);
const milesArr = await getMileageMatrix(comps.map(_ecaOriginStr), destStr);
if(window._lastQuery !== myQuery) return;

let noRoute = 0;
const rows = [];
comps.forEach((c, i) => {
  const cm = milesArr[i];
  const actual = actualByName[c.name];
  if(actual){
    const est = actual.flat;
    rows.push({
      name: c.name,
      loc: _titleCase(c.city)+", "+c.state,
      miles: cm,
      est,
      delta: gpTotal > 0 ? (est - gpTotal) : 0,
      quoted: true,
      railroad: actual.railroad || "",
    });
    return;
  }
  if(!canEstimate){ return; }
  if(cm == null){ noRoute++; return; }
  const est = isRail
    ? (railRPM * cm)
    : (Math.max(rate * cm, minCharge) + truckFuelFor(cm, cur));
  rows.push({ name:c.name, loc:_titleCase(c.city)+", "+c.state, miles:cm, est, delta: est - gpTotal, quoted:false, railroad:"" });
});

if(!rows.length){
  content.innerHTML = '<div class="eca-loading">No competitor rates or mileage available for this destination.</div>';
  return;
}

rows.sort((a,b)=> a.est - b.est);
const renderRow = (r)=>{
  const cls = r.delta < -0.5 ? "eca-neg" : (r.delta > 0.5 ? "eca-pos" : "");
  const dot = r.delta < -0.5 ? "🔴 " : (r.delta > 0.5 ? "🟢 " : "");
  const sign = r.delta < 0 ? "−" : "+";
  const milesCell = r.miles != null ? r.miles : "—";
  const badge = r.quoted ? ' <span style="font-size:10px;color:var(--text-muted);font-weight:600;">(quoted)</span>' : "";
  const deltaCell = gpTotal > 0
    ? (dot+sign+fmt(Math.abs(r.delta), cur))
    : "—";
  return "<tr><td>"+r.name+badge+'</td><td class="eca-loc">'+r.loc+'</td><td class="mono" style="text-align:right;">'+milesCell+'</td><td class="mono" style="text-align:right;">'+fmt(r.est, cur)+'</td><td class="mono eca-msf" style="text-align:right;" data-est="'+r.est+'" data-cur="'+cur+'">—</td><td class="mono '+cls+'" style="text-align:right;">'+deltaCell+"</td></tr>";
};
const head = '<tr><th>Competitor</th><th>Location</th><th style="text-align:right;">Miles</th><th style="text-align:right;">Total</th><th style="text-align:right;" title="Competitor total ÷ the same sqft per load as the GP quote">$/MSF</th><th style="text-align:right;">&Delta; vs GP</th></tr>';
const TOPN = 5;
const top = rows.slice(0, TOPN).map(renderRow).join("");
const rest = rows.slice(TOPN).map(renderRow).join("");
const nQuoted = rows.filter(r=>r.quoted).length;
const nEst = rows.length - nQuoted;
const noteRoute = noRoute ? '<div class="eca-note">'+noRoute+" competitor"+(noRoute>1?"s":"")+" had no drivable route and were skipped.</div>" : "";
let noteMethod = "";
if(nQuoted){
  noteMethod = '<div class="eca-note">'+nQuoted+" competitor lane"+(nQuoted>1?"s":"")+" from Rate Update Work (ECA Rail Rates)."+(nEst ? " "+nEst+" other"+(nEst>1?"s":"")+" estimated from GP $/mi × competitor miles." : "")+"</div>";
}else if(isRail){
  noteMethod = '<div class="eca-note">Rail estimate uses GP\'s implied '+fmt(railRPM, cur)+"/mi (lane total ÷ "+miles+" mi) applied to each competitor's distance — fuel included.</div>";
}else{
  const fpm = fscPerMile(cur);
  noteMethod = '<div class="eca-note">Truck estimate uses GP\'s '+fmt(rate, cur)+"/mi (min "+fmt(minCharge, cur)+") × each competitor's miles"
    + (fpm != null ? " + DOE fuel "+fmt(fpm, cur)+"/mi ("+fscSourceLabel(cur)+")." : " — fuel excluded (" + (fscMissingNote(cur) ? fscMissingNote(cur).split(" — ")[0] : "DOE price not loaded") + ").") + "</div>";
}
content.innerHTML = '<table class="eca-table"><thead>'+head+"</thead><tbody>"+top+"</tbody>"+(rest ? '<tbody id="ecaRest" style="display:none;">'+rest+"</tbody>" : "")+"</table>"+(rest ? '<button class="eca-toggle" onclick="toggleEcaShowAll(this)">Show all '+rows.length+"</button>" : "")+noteMethod+noteRoute;
updateEcaMsf();
}

function toggleEcaShowAll(btn){
const rest = document.getElementById("ecaRest");
if(!rest) return;
const hidden = rest.style.display === "none";
rest.style.display = hidden ? "" : "none";
btn.textContent = hidden ? "Show top 5" : ("Show all " + document.querySelectorAll(".eca-table tbody tr").length);
}

function nc(str){ return str ? str.split(",")[0].trim().toUpperCase() : ""; }

// Equipment grouping handles both long-form codes (60BX000HV, 73RF000) and
// short-form codes (B60, B63, H63, C73, H73, F60, etc.) from KBX rail data.
// Classification is based on actual EqpDesc descriptions in GP_Rail_Freight.xlsx:
//   B-prefix (B50/B52/B60/B63), H63, HF52 → BOXCAR (all describe boxcars)
//   C73/C74/H73/H74 → CENTERBEAM (not-bulkhead flat cars)
//   F60/F62 → CENTERBEAM (bulkhead flatcars)
// B-Train truck rates use equipment codes ending in "BT" (e.g. 58FT000BT).
function isBTrainEquip(code){
return /BT$/.test((code || "").toString().trim().toUpperCase());
}

function railEquipGroup(code){
const c = (code || "").trim().toUpperCase();
if (!c) return "UNKNOWN";
// Long-form codes
if (c.includes("BX")) return "BOXCAR";
if (c.includes("CH")) return "BOXCAR";
if (c.includes("RF")) return "CENTERBEAM";
if (c.includes("BF")) return "CENTERBEAM";
// Short-form code lookup (KBX rail rates)
const SHORT_FORM = {
"B50":"BOXCAR","B52":"BOXCAR","B60":"BOXCAR","B63":"BOXCAR",
"H63":"BOXCAR","HF52":"BOXCAR",
"C73":"CENTERBEAM","C74":"CENTERBEAM","H73":"CENTERBEAM","H74":"CENTERBEAM",
"F60":"CENTERBEAM","F62":"CENTERBEAM"
};
if (SHORT_FORM[c]) return SHORT_FORM[c];
// Fallback heuristics for unknown short-form codes
if (/^B\d/.test(c)) return "BOXCAR";
if (/^F\d/.test(c)) return "CENTERBEAM";
return "OTHER";
}

// Lower priority value wins. Prefer the most "standard" rate per group.
function getBoxcarPriority(code){
const c = (code || "").trim().toUpperCase();
// Long-form
if (c === "60BX000HV") return 1;
if (c === "60BX000HV POOL") return 2;
if (c === "60BX000") return 3;
if (c === "52BX000HV") return 4;
if (c === "52BX000") return 5;
if (c === "50BX000") return 6;
if (c === "50CH0PD") return 7;
if (c === "50CH0PDNSYS") return 8;
// Short-form
if (c === "B60") return 10;     // 60 Ft BOXCAR
if (c === "B63") return 11;     // 60 Ft BOXCAR HIGH CAPACITY
if (c === "H63") return 12;     // AAR Pool 7540009 Box
if (c === "HF52") return 13;    // 52 Ft BOXCAR CAPACITY >5600 CU FT
if (c === "B52") return 14;     // 52 Ft BOXCAR
if (c === "B50") return 15;     // 50 Ft BOXCAR
// Legacy patterns
if (c.endsWith("63")) return 20;
if (c.endsWith("60")) return 21;
if (c.endsWith("50")) return 22;
if (c.endsWith("52")) return 23;
return 99;
}

function getCenterbeamPriority(code){
const c = (code || "").trim().toUpperCase();
// Long-form
if (c === "73RF000") return 1;
if (c === "73RF000HH") return 2;
if (c === "73RF000NSYS") return 3;
if (c === "73RF000HHNSYS") return 4;
if (c === "60BF000") return 5;
if (c === "62BF000") return 6;
// Short-form (C73/C74/H73/H74 = not-bulkhead flat car; F60/F62 = bulkhead flat)
if (c === "C73") return 10;
if (c === "H73") return 11;
if (c === "C74") return 12;
if (c === "H74") return 13;
if (c === "F60") return 14;
if (c === "F62") return 15;
// Legacy patterns
if (c.endsWith("73")) {
if (c.startsWith("C")) return 20;
if (c.startsWith("H")) return 21;
return 22;
}
return 99;
}

// Band lookup: for rates with banded distances (BAND UOM MIN/MAX), select the row
// whose miles range covers the trip distance. Falls back to unbanded row.
function rateMatchesBand(r, miles){
const bMin = Number(r.bandMin);
const bMax = Number(r.bandMax);
const hasBand = !isNaN(bMin) && !isNaN(bMax) && (bMin > 0 || bMax > 0);
if (!hasBand) return true; // unbanded rows always eligible
if (miles == null) return true; // no miles info - accept any band
return miles >= bMin && miles <= bMax;
}

function findRate(originFac, destCity, destState, destZip, miles){
let best=null, bestScore=-1, bestPriority=999, bestPrice=Infinity;
for(const r of RATES){
if(r.mode !== SELECTED_MODE) continue;
if(!customerMatches(r)) continue;
if(SELECTED_MODE==="RAIL" && SELECTED_RAIL_EQ!=="ALL" && SELECTED_RAIL_EQ!=="COMPARE"){
const grp = railEquipGroup(r.equip);
if(grp !== SELECTED_RAIL_EQ) continue;
}
if(SELECTED_MODE==="TRUCK" && !truckEquipMatches(r)) continue;
const scored = scoreRate(r, originFac, destCity, destState, destZip);
if(scored < 0) continue;
if(!rateMatchesBand(r, miles)) continue;
let priority = 0;
if(SELECTED_MODE === "RAIL"){
const grp = railEquipGroup(r.equip);
if(grp === "BOXCAR") priority = getBoxcarPriority(r.equip);
else if(grp === "CENTERBEAM") priority = getCenterbeamPriority(r.equip);
else priority = 999;
}
// Compare price for tiebreaking when score+priority tie (prefer cheapest)
const isMI = (r.uom||"").toString().toUpperCase() === "MI";
const price = isMI ? (Number(r.rate)||Infinity) : (Number(r.flat)||Infinity);
if(
scored > bestScore ||
(scored === bestScore && priority < bestPriority) ||
(scored === bestScore && priority === bestPriority && price < bestPrice)
){
bestScore = scored;
bestPriority = priority;
bestPrice = price;
best = { ...r, score: scored };
}
}
return bestScore >= 0 ? best : null;
}

function findRateByGroup(originFac, destCity, destState, destZip, group, routeKey){
let best = null;
let bestScore = -1;
let bestPriority = 999;
let bestPrice = Infinity;
for(const r of RATES){
if(r.mode !== "RAIL") continue;
if(railEquipGroup(r.equip) !== group) continue;
if(routeKey && railRouteKey(r) !== routeKey) continue;  // Route dropdown filter
const scored = scoreRate(r, originFac, destCity, destState, destZip);
if(scored < 0) continue;
let priority = 0;
if(group === "BOXCAR"){
priority = getBoxcarPriority(r.equip);
} else if(group === "CENTERBEAM"){
priority = getCenterbeamPriority(r.equip);
}
const isMI = (r.uom||"").toString().toUpperCase() === "MI";
const price = isMI ? (Number(r.rate)||Infinity) : (Number(r.flat)||Infinity);
if(
scored > bestScore ||
(scored === bestScore && priority < bestPriority) ||
(scored === bestScore && priority === bestPriority && price < bestPrice)
){
bestScore = scored;
bestPriority = priority;
bestPrice = price;
best = { ...r, score: scored };
}
}
return bestScore >= 0 ? best : null;
}

function scoreRate(r, originFac, destCity, destState, destZip){
let origScore=0;
if(r.origLoc){
if(nc(r.origLoc) === nc(originFac)) origScore=3;
else return -1;
}else if(r.origStateField){
// State-only origin
const st = (r.origStateField.split(",")[0]||"").trim().toUpperCase();
const originSt = (originFac.split(",")[1]||"").trim().toUpperCase();
if(originSt && st === originSt) origScore=2;
else return -1;
}else{
origScore=1;
}
let destScore=0;
if(r.destLoc){
const city = nc(r.destLoc);
const st = (r.destLoc.split(",")[1]||"").trim().toUpperCase();
// City+state both match = exact (3). City matches but wrong state = REJECT.
// State-only matches when user only provided state (no city) = partial (2).
if(destCity && city===destCity){
if(destState && st && st !== destState) return -1;  // wrong state, reject
destScore=3;
}else if(destCity){
return -1;  // city was specified but didn't match
}else if(destState && st===destState){
destScore=2;
}else{
return -1;
}
}else if(r.destPostal){
if(destZip){
const dz = destZip.replace(/[^0-9A-Z]/g,"");
const pz = nc(r.destPostal).replace(/[^0-9A-Z]/g,"");
if(dz===pz || dz.startsWith(pz) || pz.startsWith(dz.substring(0,3))) destScore=3;
else return -1;
}else if(destState){
// Fall back to state match using the destPostal's state portion
const postParts = r.destPostal.split(",");
const postSt = (postParts[1]||"").trim().toUpperCase();
if(postSt && postSt === destState) destScore=2;
else return -1;
}else{
return -1;
}
}else if(r.destStateField){
const st = (r.destStateField.split(",")[0]||"").trim().toUpperCase();
if(destState && st === destState) destScore=2;
else return -1;
}else{
destScore=1;
}
return origScore*10 + destScore;
}

function displayResults(match, miles){
currentMatch = match;
currentCompareMatches = null;
updateResultBadge();
const badge = document.getElementById("matchBadge");
const rateTypeBadge = document.getElementById("rateTypeBadge");
const content = document.getElementById("resultsContent");
if(!match){
badge.innerHTML = '<span class="match-badge match-none">No Match Found</span>';
rateTypeBadge.textContent = "";
content.innerHTML = '<div class="no-results">No rate found for this origin/destination with the current filters.</div>';
msfPrepare(null);
return;
}
const quality = (match.via && match.via.kind !== "alias") ? "partial" : match.score>=30 ? "exact" : match.score>=20 ? "partial" : "estimated";
badge.innerHTML = quality==="exact"
? '<span class="match-badge match-exact">✓ Exact Match</span>'
: quality==="partial"
? '<span class="match-badge match-partial">≈ Partial Match</span>'
: '<span class="match-badge match-none">~ Estimated</span>';
const isMI = (match.uom||"").toString().toUpperCase() === "MI";
const isRail = match.mode === "RAIL";
const isBTrain = match.mode === "TRUCK" && isBTrainEquip(match.equip);
// B-Train is a flat, all-in lane rate just like rail (no separate fuel line).
const isAllIn = isRail || isBTrain || Boolean(match.customer);
const equipLabel = match.equip ? ` &nbsp;·&nbsp; <span style="font-size:11px;color:#475569;font-weight:600;">${match.equip}</span>` : "";
rateTypeBadge.innerHTML = `<span style="font-size:12px;color:#1e293b;margin-left:4px;">${isMI ? "Per Mile" : "Flat Charge"}${equipLabel}${match.customer ? " · " + match.customer : ""}${match.via ? " · " + _escHtml(railViaShort(match.via)) : ""}</span>`;
const currency = match.currency || "USD";
const gpRate = isMI ? (Number(match.rate)||0) : (Number(match.flat)||0);
const minCharge = Number(match.minCharge)||0;
const milesActual = (isMI && miles!=null) ? miles : (isMI ? 500 : 0);
const derivedRPM = (!isMI && miles != null && miles > 0) ? (gpRate / miles) : null;
const milesLabel = (miles!=null) ? miles : (isMI ? "~500 (est.)" : "—");
const milesFailed = isMI && miles==null;
const gpAvg = isMI ? gpRate*milesActual : gpRate;
// Rail, B-Train and customer rates already include fuel - don't add it again.
// Truck fuel = DOE $/mi x Google miles (never the ~500 mi estimate); when miles
// or the DOE price are missing, fuel is shown as unavailable (null), not $0.
const fuelPerMile = isAllIn ? null : fscPerMile(currency);
const fuelMiles = (miles != null && miles > 0) ? miles : null;
const gpFuel = isAllIn ? 0 : ((fuelPerMile != null && fuelMiles != null) ? fuelPerMile * fuelMiles : null);
const fuelMissing = !isAllIn && gpFuel == null;
const fuelNote = isAllIn ? "" : (!fuelMissing
  ? `Fuel: ${fmt(fuelPerMile,currency)}/mi × ${fuelMiles} mi (${fscSourceLabel(currency)})`
  : (fuelPerMile == null ? fscMissingNote(currency) : "Google miles unavailable — can't price fuel; total excludes fuel"));
// Rate Per Mile is shown ALL-IN, per user: Total Freight (avg + fuel) / miles.
const rpmMiles = isMI ? milesActual : miles;
const gpAllInRPM = (rpmMiles && rpmMiles > 0) ? (gpAvg + (gpFuel || 0)) / rpmMiles : null;
window._matchData = { type:"single", isMI, isRail: isAllIn, gpRate, minCharge, currency, gpAvg, gpFuel, derivedRPM, rpmMiles, fuelMissing };
const milesNote = milesFailed
? ' <span style="font-size:11px;color:#d97706;font-style:italic;">(Google miles unavailable — using estimate)</span>'
: (isMI && miles!=null)
? ' <span style="font-size:11px;color:#16a34a;font-style:italic;">via Google Maps</span>'
: '';
content.innerHTML = `${railViaNoteHTML(match.via)}
<table id="rateTable" class="no-adjust">
<thead>
<tr><th>Item</th><th>GP Rate</th><th>Adjust Rate</th><th>% Difference</th></tr>
</thead>
<tbody>
<tr>
<td>Miles${milesNote}</td>
<td class="mono">${milesLabel}</td>
<td class="mono">${milesLabel}</td>
<td class="mono diff-zero">—</td>
</tr>
<tr>
<td>Rate Per Mile <span style="font-size:11px;color:var(--text-muted);font-style:italic;">${fuelMissing ? "(excl. fuel)" : "(incl. fuel)"}</span></td>
<td class="mono" id="gpRPM">${gpAllInRPM != null ? fmt(gpAllInRPM,currency) : "—"}<span class="currency-badge">${currency}</span></td>
<td class="mono" id="adjRPM">${gpAllInRPM != null ? fmt(gpAllInRPM,currency) : "—"}</td>
<td class="mono diff-zero" id="diffRPM">—</td>
</tr>
${isAllIn ?`
<tr>
<td>Fuel Per Load <span style="font-size:11px;color:var(--text-muted);font-style:italic;">(included in rate)</span></td>
<td class="mono" style="color:var(--text-muted);">included</td>
<td class="mono" style="color:var(--text-muted);">included</td>
<td class="mono diff-zero">—</td>
</tr>
` : `
<tr>
<td>Fuel Per Load <span class="fuel-note${fuelMissing ? " fuel-na" : ""}" id="fuelNote">${fuelNote}</span></td>
<td class="mono" id="gpFuelCell">${fuelMissing ? '<span class="fuel-na">unavailable</span>' : fmt(gpFuel,currency) + '<span class="currency-badge">' + currency + '</span>'}</td>
<td class="mono" id="adjFuelCell">${fuelMissing ? '<span class="fuel-na">unavailable</span>' : fmt(gpFuel,currency)}</td>
<td class="mono diff-zero" id="diffFuel">—</td>
</tr>
`}
<tr>
<td>${isAllIn ?"Total Rate Per Load" : "Avg Rate Per Load"}</td>
<td class="mono" id="gpAvgCell">${fmt(gpAvg,currency)}<span class="currency-badge">${currency}</span></td>
<td class="mono" id="adjAvgCell">${fmt(0,currency)}</td>
<td class="mono diff-zero" id="diffAvg">—</td>
</tr>
</tbody>
<tfoot>
<tr class="total-row">
<td>Total Freight Per Load${fuelMissing ? ' <span class="fuel-note fuel-na" style="display:inline;">(excl. fuel)</span>' : ""}</td>
<td class="mono" id="totalGP">${fmt(0,currency)}</td>
<td class="mono" id="totalAdj">${fmt(0,currency)}</td>
<td class="mono diff-zero" id="totalDiff">—</td>
</tr>
</tfoot>
</table>`;
document.getElementById("pctAdj").value = 0;
msfPrepare({ kind:"truck", originFac:(window._lastQuery && window._lastQuery.originFac) || document.getElementById("originFacility")?.value, truckEquip:match.equip });
recalc();
}

function _splitSum(s){
if(!s) return null;
const nums = (String(s).match(/\$\s*[\d,]+\.?\d*/g) || []).map(x => parseFloat(x.replace(/[$,\s]/g,"")));
return nums.length ? nums.reduce((a,b)=>a+b,0) : null;
}

function _routeArrows(route){
return route ? String(route).split("-").join(" → ") : "";
}

function displayCompareResults(boxcar, centerbeam, miles){
currentMatch = null;
currentCompareMatches = { boxcar, centerbeam, miles };
updateResultBadge();
const badge = document.getElementById("matchBadge");
const rateTypeBadge = document.getElementById("rateTypeBadge");
const content = document.getElementById("resultsContent");
if(!boxcar && !centerbeam){
badge.innerHTML = '<span class="match-badge match-none">No Match Found</span>';
rateTypeBadge.textContent = "";
content.innerHTML = '<div class="no-results">No boxcar or centerbeam rates found for this origin/destination.</div>';
msfPrepare(null);
return;
}
badge.innerHTML = RAIL_VIA && RAIL_VIA.kind !== "alias" ? '<span class="match-badge match-partial">\u2248 Compare Mode (via nearby station)</span>' : '<span class="match-badge match-exact">Compare Mode</span>';
const selRoute = RAIL_ROUTE.selected ? RAIL_ROUTE.options.find(o => o.key === RAIL_ROUTE.selected) : null;
rateTypeBadge.innerHTML = '<span style="font-size:12px;color:#1e293b;margin-left:4px;">Boxcar vs Centerbeam' + (selRoute ? ' \u00b7 ' + _escHtml(railRouteLabel(selRoute)) : '') + (RAIL_VIA ? ' \u00b7 ' + _escHtml(railViaShort(RAIL_VIA)) : '') + '</span>';
let routeNote = "";
if(selRoute && RAIL_ROUTE.options.length){
const cheapest = RAIL_ROUTE.options[0];
routeNote = cheapest.key === selRoute.key
  ? `<div class="rail-route-note">Route picked: <strong>${_escHtml(railRouteLabel(selRoute))}</strong> (cheapest route on file).</div>`
  : `<div class="rail-route-note">Route picked: <strong>${_escHtml(railRouteLabel(selRoute))}</strong> \u2014 not the cheapest. Cheapest on file: ${_escHtml(railRouteLabel(cheapest))} at ${_fmtShort(cheapest.best, cheapest.currency)}.</div>`;
}

const bcCur = boxcar?.currency || "USD";
const cbCur = centerbeam?.currency || "USD";
const bcTotal = boxcar ? (Number(boxcar.flat)||0) : null;
const cbTotal = centerbeam ? (Number(centerbeam.flat)||0) : null;

let winnerNote = "";
if(bcTotal != null && cbTotal != null){
const diff = bcTotal - cbTotal;
if(Math.abs(diff) < 0.01){
winnerNote = `<div class="compare-winner">📊 Boxcar and Centerbeam are priced equally at ${fmt(bcTotal,bcCur)}.</div>`;
}else if(diff < 0){
winnerNote = `<div class="compare-winner">💰 Boxcar saves ${fmt(Math.abs(diff),bcCur)} (${((Math.abs(diff)/cbTotal)*100).toFixed(1)}%) vs Centerbeam.</div>`;
}else{
winnerNote = `<div class="compare-winner">💰 Centerbeam saves ${fmt(Math.abs(diff),cbCur)} (${((Math.abs(diff)/bcTotal)*100).toFixed(1)}%) vs Boxcar.</div>`;
}
}

const cardHtml = (label, m, cur, total) => {
if(!m) return `<div class="compare-card"><div class="compare-title">${label}</div><div style="padding:16px;color:var(--text-muted);font-size:13px;">No rate found.</div></div>`;
const routeArrows = _routeArrows(m.route);
const split = m.carrierSplit || "";
const ssum = _splitSum(split);
const gap = (ssum != null) ? (total - ssum) : 0;
let feesRow = "";
if(gap >= 0.02) feesRow = `<div class="truck-rail-row"><span class="truck-rail-label">+ Other fees</span><span class="truck-rail-value">${fmt(gap,cur)}</span></div>`;
else if(gap <= -0.02) feesRow = `<div class="truck-rail-row"><span class="truck-rail-label">Adjustment</span><span class="truck-rail-value">−${fmt(Math.abs(gap),cur)}</span></div>`;
return `<div class="compare-card">
<div class="compare-title">${label} &nbsp;·&nbsp; <span style="font-weight:500;color:var(--text-muted);">${m.equip||""}</span></div>
<div style="padding:14px 16px;">
<div class="truck-rail-row"><span class="truck-rail-label">Equipment</span><span class="truck-rail-value">${m.equip||"—"}</span></div>
<div class="truck-rail-row"><span class="truck-rail-label">Currency</span><span class="truck-rail-value">${cur}</span></div>
${routeArrows ? `<div class="rail-route-block"><span class="truck-rail-label">Route</span><div class="rail-route-val">${routeArrows}</div></div>` : ""}
${m.destRR ? `<div class="truck-rail-row"><span class="truck-rail-label">Dest. railroad</span><span class="truck-rail-value">${_escHtml(m.destRR)}</span></div>` : ""}
${split ? `<div class="rail-route-block"><span class="truck-rail-label">Carrier split</span><div class="rail-route-val">${split}</div></div>` : ""}
${feesRow}
<div class="truck-rail-row"><span class="truck-rail-label">Total Rate</span><span class="truck-rail-value">${fmt(total,cur)}</span></div>
<div class="truck-rail-row"><span class="truck-rail-label">$/MSF</span><span class="truck-rail-value" id="${label === "Boxcar" ? "msfBox" : "msfCb"}">—</span></div>
</div>
</div>`;
};

content.innerHTML = `
${railViaNoteHTML(RAIL_VIA)}
${routeNote}
${winnerNote}
<div class="compare-grid">
${cardHtml("Boxcar", boxcar, bcCur, bcTotal)}
${cardHtml("Centerbeam", centerbeam, cbCur, cbTotal)}
</div>
${railRoutesPanelHTML()}`;
msfPrepare({ kind:"rail", originFac:(window._lastQuery && window._lastQuery.originFac) || document.getElementById("originFacility")?.value, boxEquip: boxcar && boxcar.equip });
msfRefresh();
}

function fmt(n, currency){
if(n == null || isNaN(n)) return "—";
const sign = currency === "CAD" ? "C$" : "$";
return sign + Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtPct(n){
if(n == null || isNaN(n) || !isFinite(n)) return "—";
const s = n >= 0 ? "+" : "";
return s + Number(n).toFixed(1) + "%";
}

function pctClass(n){
if(n == null || isNaN(n) || Math.abs(n) < 0.05) return "diff-zero";
return n > 0 ? "diff-positive" : "diff-negative";
}

function recalc(){
const data = window._matchData;
if(!data || data.type !== "single") return;
const pct = Number(document.getElementById("pctAdj").value) || 0;
const factor = 1 + pct/100;
// Only show the Adjust Rate + % Difference columns once a real adjustment exists
const _tbl = document.getElementById("rateTable");
if(_tbl) _tbl.classList.toggle("no-adjust", pct === 0);
const { isMI, isRail, gpRate, minCharge, currency, gpAvg, gpFuel, derivedRPM, rpmMiles, fuelMissing } = data;

const adjAvg = Math.max(gpAvg * factor, minCharge);
// % Adjustment applies to linehaul only - fuel stays at the DOE amount.
const adjFuel = gpFuel;

const gpTotal = gpAvg + (gpFuel || 0);
const adjTotal = adjAvg + (adjFuel || 0);
const totalPct = gpTotal > 0 ? ((adjTotal - gpTotal) / gpTotal) * 100 : 0;

const setCell = (id, html, cls) => {
const el = document.getElementById(id);
if(!el) return;
el.innerHTML = html;
if(cls){ el.className = "mono " + cls; }
};

// Rate Per Mile = all-in Total Freight / miles (GP column set in displayResults;
// here we update the adjusted column and % difference).
if(rpmMiles && rpmMiles > 0){
const gpAllInRPM = gpTotal / rpmMiles;
const adjAllInRPM = adjTotal / rpmMiles;
setCell("adjRPM", `${fmt(adjAllInRPM,currency)}<span class="currency-badge">${currency}</span>`);
const rpmPct = gpAllInRPM > 0 ? ((adjAllInRPM - gpAllInRPM)/gpAllInRPM)*100 : 0;
setCell("diffRPM", fmtPct(rpmPct), pctClass(rpmPct));
}

// Fuel cells only exist for non-rail (rail shows "included" placeholder).
// Fuel is not adjusted, so its % difference is always "—".
if(!isRail && !fuelMissing){
setCell("adjFuelCell", `${fmt(adjFuel,currency)}<span class="currency-badge">${currency}</span>`);
setCell("diffFuel", "—", "diff-zero");
}

setCell("adjAvgCell", `${fmt(adjAvg,currency)}<span class="currency-badge">${currency}</span>`);
const avgPct = gpAvg > 0 ? ((adjAvg - gpAvg)/gpAvg)*100 : 0;
setCell("diffAvg", fmtPct(avgPct), pctClass(avgPct));

// $/MSF = total / sqft per load x 1000 (right side of the total cell).
setCell("totalGP", `<div class="tot-flex"><span>${fmt(gpTotal,currency)}<span class="currency-badge">${currency}</span></span>${msfValHTML(gpTotal, "truck", currency, true)}</div>`);
const _adjMsf = msfValue(adjTotal, "truck");
setCell("totalAdj", `${fmt(adjTotal,currency)}<span class="currency-badge">${currency}</span><span class="msf-mini">${_adjMsf != null ? fmt(_adjMsf,currency) : "—"} /MSF</span>`);
setCell("totalDiff", fmtPct(totalPct), pctClass(totalPct));
window._lastRailTotal = adjTotal;
}

function clearForm(){
document.getElementById("originFacility").value = "";
document.getElementById("originCity").value = "";
document.getElementById("originState").value = "";
document.getElementById("originZip").value = "";
document.getElementById("destCity").value = "";
document.getElementById("destState").value = "";
document.getElementById("destZip").value = "";
document.getElementById("pctAdj").value = 0;
document.getElementById("errorBanner")?.classList.remove("show");
const _sti = document.getElementById("shipToId"); if(_sti) _sti.value = "";
if(SHIP_TO_APPLIED && SHIP_TO_APPLIED.setCustomer){
const _cf = document.getElementById("customerFilter");
if(_cf && _cf.value){ _cf.value = ""; SELECTED_CUSTOMER = ""; }
}
SHIP_TO_APPLIED = null;
_setShipToMsg("", "");
RAIL_VIA_PICK.clear();
LAST_DEST_ZIPS = [];
hideZipPicker();
clearResultsOnly();
refreshRailRouteOptions();
}

loadRates();
</script>
